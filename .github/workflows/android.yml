name: Android build

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: android-build-main
  cancel-in-progress: true

jobs:
  debug-apk:
    if: github.event.head_commit.message != 'Add emulator proof screenshots'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon clean assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: f21-os-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  emulator-proof:
    if: github.event.head_commit.message != 'Add emulator proof screenshots'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: |
            adb shell wm size 480x640
            adb shell wm density 286
            chmod +x tools/emulator-proof.sh
            ./tools/emulator-proof.sh
      - name: Validate PNG signatures
        run: |
          for f in screenshots/*.png; do test "$(head -c 8 "$f" | xxd -p)" = "89504e470d0a1a0a"; done
      - uses: actions/upload-artifact@v4
        with:
          name: f21-os-emulator-proof
          path: screenshots/*.png
      - name: Publish proof screenshots to repository
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/proof"
          cp screenshots/*.png "$RUNNER_TEMP/proof/"
          git config user.name "F21 OS CI"
          git config user.email "f21-os-ci@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B ci-publish origin/main
            cp "$RUNNER_TEMP/proof/"*.png screenshots/
            git add screenshots/*.png
            if git diff --cached --quiet; then
              echo "screenshots unchanged; nothing to publish"
              exit 0
            fi
            git commit -m "Add emulator proof screenshots"
            if git push origin ci-publish:main; then
              exit 0
            fi
            echo "push raced; retrying (attempt $i)"
            sleep $((i * 10))
          done
          exit 1
      - name: Verify screenshots exist
        run: test -s screenshots/idle.png -a -s screenshots/menu.png -a -s screenshots/menu-key-navigation.png
