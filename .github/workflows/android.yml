name: Android build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x gradlew && ./gradlew --no-daemon clean assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: f21-os-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  emulator-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: |
            adb shell wm size 480x640
            adb shell wm density 286
            ./tools/emulator-proof.sh
      - uses: actions/upload-artifact@v4
        with:
          name: f21-os-emulator-proof
          path: screenshots/*.png
