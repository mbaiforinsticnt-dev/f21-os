name: Android build

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon clean assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: f21-os-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  emulator-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon assembleDebug
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: |
            adb shell wm size 480x640
            adb shell wm density 286
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb shell settings put global policy_control immersive.full=*
            adb shell pm disable-user --user 0 com.android.systemui || true
            chmod +x tools/emulator-proof.sh
            ./tools/emulator-proof.sh
      - uses: actions/upload-artifact@v4
        with:
          name: f21-os-emulator-proof
          path: screenshots/*.png
      - name: Publish proof screenshots to repository
        run: |
          git config user.name "F21 OS CI"
          git config user.email "f21-os-ci@users.noreply.github.com"
          git add screenshots/*.png
          git commit -m "Add emulator proof screenshots" || exit 0
          git push
      - name: Verify screenshots exist
        run: test -s screenshots/idle.png -a -s screenshots/menu.png -a -s screenshots/menu-key-navigation.png
