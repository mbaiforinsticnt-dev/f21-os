name: T9 comparison

permissions:
  contents: write

on:
  push:
    branches: [t9-comparison]
  workflow_dispatch:

jobs:
  build-imes:
    if: github.event.head_commit.message != 'Add T9 comparison screenshots'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tt9
            repo: sspanak/tt9
            ref: 05b92fcacbfe79b5339a60a3d8ddb614001907e2
            java: '21'
            task: generateDocs validateLanguages buildDefinition buildDictionaryDownloads copyDownloadsToAssets assembleFullDebug
          - name: qinboard
            repo: AshiVered/QinBoard-T9
            ref: cb9501d2d1169e6947e41ae5d24a3634564e5f5f
            java: '17'
            task: assembleDebug
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: src-ime
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
      - name: Patch dead jcenter repository (qinboard)
        if: matrix.name == 'qinboard'
        run: sed -i '/jcenter/d' src-ime/build.gradle
      - name: Trim tt9 languages to English (keep APK emulator-sized)
        if: matrix.name == 'tt9'
        run: find src-ime/app/languages/definitions -name '*.yml' ! -name 'English.yml' -delete
      - name: Build IME
        run: |
          cd src-ime
          chmod +x gradlew
          ./gradlew --no-daemon ${{ matrix.task }}
      - uses: actions/upload-artifact@v4
        with:
          name: ime-${{ matrix.name }}
          path: 'src-ime/**/build/outputs/apk/**/*.apk'

  emulator-t9:
    if: github.event.head_commit.message != 'Add T9 comparison screenshots'
    needs: build-imes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false
      - run: gradle --no-daemon assembleDebug
      - uses: actions/download-artifact@v4
        with:
          name: ime-tt9
          path: imes/tt9
      - uses: actions/download-artifact@v4
        with:
          name: ime-qinboard
          path: imes/qinboard
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -memory 4096 -partition-size 2048
          disable-animations: true
          script: |
            adb shell wm size 480x640
            adb shell wm density 286
            chmod +x tools/t9-proof.sh
            ./tools/t9-proof.sh
      - name: Validate PNG signatures
        run: |
          for f in screenshots-t9/*.png; do test "$(head -c 8 "$f" | xxd -p)" = "89504e470d0a1a0a"; done
      - uses: actions/upload-artifact@v4
        with:
          name: t9-comparison-screenshots
          path: screenshots-t9/*.png
      - name: Publish screenshots to branch
        run: |
          git config user.name "F21 OS CI"
          git config user.email "f21-os-ci@users.noreply.github.com"
          git add screenshots-t9/*.png
          git commit -m "Add T9 comparison screenshots" || exit 0
          git reset --hard HEAD
          git fetch origin t9-comparison
          git rebase origin/t9-comparison
          git push origin HEAD:t9-comparison
      - name: Verify screenshots exist
        run: test -s screenshots-t9/tt9-01-harness.png -a -s screenshots-t9/qinboard-01-harness.png
